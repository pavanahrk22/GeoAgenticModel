version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: geoagentic
      POSTGRES_USER: geoagentic
      POSTGRES_PASSWORD: geoagentic_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoagentic"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://geoagentic:geoagentic_secret@postgres:5432/geoagentic
      ROUTING_PROVIDER: osrm
      OSRM_BASE_URL: https://router.project-osrm.org
      LLM_PROVIDER: none
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
      SIMULATOR_TICK_INTERVAL: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Local OSRM instance
  # osrm:
  #   image: osrm/osrm-backend
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./osrm-data:/data
  #   command: osrm-routed --algorithm mld /data/bangalore.osrm

volumes:
  pgdata:
